name: Deploy Astrofy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Explicit permissions required for GitHub Actions to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Isolated concurrency group to prevent deadlocks on GitHub's internal "pages" lock
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install, build, and upload Astrofy site
        uses: withastro/action@v3
        with:
          node-version: 20
          # Explicitly set npm to prevent pnpm-lockfile auto-detection errors.
          # (If you prefer pnpm, change this line to: package-manager: pnpm@latest)
          package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4