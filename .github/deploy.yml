# .github/workflows/deploy.yml
name: Deploy Astrofy to GitHub Pages

on:
  # Trigger the workflow every time you push to the main branch
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grant the necessary permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from colliding
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Install, build, and upload your Astrofy site
        uses: withastro/action@v3
        with:
          # Astrofy works best on Node 20. The Astro action defaults to Node 24, which can break older dependencies.
          node-version: 20
          
          # The Astro action automatically detects npm, pnpm, or yarn based on your lockfile.
          # If your build fails because you haven't committed a lockfile (like package-lock.json), uncomment the line below:
          # package-manager: npm@latest 

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5